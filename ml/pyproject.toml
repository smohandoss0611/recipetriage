[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "recipetriage-ml"
version = "0.5.0"
requires-python = ">=3.12"
dependencies = ["python-dotenv>=1,<2", "pydantic>=2.10,<3", "httpx>=0.28,<1"]
[project.optional-dependencies]
hf = ["transformers>=4.45,<5", "torch>=2.6,<3"]
notebook = ["nbformat>=5,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8"]
analysis = ["matplotlib==3.10.8", "pandas>=2,<4"]
training = ["torch>=2.6,<3"]
sft = ["torch==2.14.0", "transformers==4.57.6", "trl==0.24.0", "peft==0.17.1", "datasets==4.3.0", "accelerate==1.11.0"]
experiments = ["bitsandbytes==0.50.2", "mlflow-skinny==3.16.0", "alembic==1.19.2"]
[tool.setuptools]
packages = ["recipetriage_ml", "recipetriage_ml.inference", "recipetriage_ml.data", "recipetriage_ml.evaluation", "recipetriage_ml.training", "recipetriage_ml.alignment", "recipetriage_ml.analysis", "recipetriage_ml.deployment"]
package-dir = {"recipetriage_ml" = "."}
[tool.setuptools.package-data]
recipetriage_ml = ["examples/*.json", "data/seed.json", "data/prompts/*.txt", "evaluation/bench_v1.json", "evaluation/bench_v1.sha256", "training/architecture_qwen.json"]
