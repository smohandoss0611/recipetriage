name: recipetriage
services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.16.0
    profiles: [tracking]
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --workers=1
      - --backend-store-uri=sqlite:////mlflow/mlflow.db
      - --artifacts-destination=/mlflow/artifacts
      - --serve-artifacts
      - --allowed-hosts=localhost:*,127.0.0.1:*,mlflow:5000
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5050}:5000"
    volumes:
      - mlflow_data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=5)"]
      interval: 5s
      timeout: 6s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    environment: &backend-env
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      FIREWORKS_API_KEY: ${FIREWORKS_API_KEY:-}
      FIREWORKS_MODEL: ${FIREWORKS_MODEL:-accounts/fireworks/models/nemotron-lightning-3p5-30b-a3b}
      FIREWORKS_SYNTHETIC_MODEL: ${FIREWORKS_SYNTHETIC_MODEL:-accounts/fireworks/models/nemotron-lightning-3p5-30b-a3b}
      FIREWORKS_RECIPE_MODEL: ${FIREWORKS_RECIPE_MODEL:-accounts/fireworks/models/nemotron-lightning-3p5-30b-a3b}
      FIREWORKS_ACCOUNT_ID: ${FIREWORKS_ACCOUNT_ID:-}
      FIREWORKS_SFT_MODEL: ${FIREWORKS_SFT_MODEL:-}
      FIREWORKS_SFT_DEPLOYMENT_SHAPE: ${FIREWORKS_SFT_DEPLOYMENT_SHAPE:-}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-}
      MLFLOW_EXPERIMENT_NAME: ${MLFLOW_EXPERIMENT_NAME:-RecipeTriage-fixed-benchmark}
      MODEL_GATE_JSON: ${MODEL_GATE_JSON:-}
      TRAINING_RUNS_DIR: /training
      HF_HOME: /models
      HF_CPU_THREADS: 4
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - model_cache:/models
      - training_artifacts:/training
      - ./ml/deployment/artifacts:/deployment:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=8)"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend-tests:
    profiles: [test]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: test
    environment:
      <<: *backend-env
      RUN_DB_TESTS: "1"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  mlflow_data:
  postgres_data:
  model_cache:
  training_artifacts:
